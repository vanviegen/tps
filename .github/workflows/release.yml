# Builds the release binaries and attaches them to a GitHub release, whenever a
# v* tag is pushed — which deploying TPS does (see deploy.sh). The assets are
# named after `uname -s` and `uname -m`, so the README's curl line picks the
# right one; macOS gets the dashboard, its daemons being on Linux hosts.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Bundle the web UI
        run: npm ci && npm run build
      - name: Build
        run: |
          set -e
          for target in linux:amd64:x86_64 linux:arm64:aarch64 darwin:amd64:x86_64 darwin:arm64:arm64; do
            IFS=: read -r goos goarch arch <<<"$target"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X github.com/vanviegen/tps/ui.Version=$GITHUB_REF_NAME" -o "dist/tps-$goos-$arch" .
          done
          ls -l dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A draft until its binaries are there: --auto-update installs the
        # latest release, and must not find one with nothing to download.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
